# nginx/conf.d/nexus.conf
server {
    listen 80;
    server_name _ localhost;
    
    access_log /var/log/nginx/nexus-access.log main;
    error_log /var/log/nginx/nexus-error.log warn;
    
    location /static/ {
        alias /static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    
    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }
    
    # ✅ P1-A FIX: /health di-proxy ke Flask supaya security headers
    # dari Flask ikut terkirim. Sebelumnya di-short-circuit oleh Nginx.
    location = /health {
        proxy_pass http://nexus-iot:5000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }
    
    location / {
        proxy_pass http://nexus-iot:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}