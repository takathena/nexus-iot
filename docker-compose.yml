services:
  nexus-iot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexus-iot
    restart: unless-stopped
    expose:
      - "${PORT:-5000}"
    volumes:
      - ./database:/app/database
      - ./logs:/app/logs
      - ./backup:/app/backup
      - ./.env:/app/.env:ro
      - ./templates:/app/templates:ro
      - ./static:/app/static:ro
    environment:
      - FLASK_ENV=${FLASK_ENV:-production}
      - PYTHONUNBUFFERED=1
      - PORT=${PORT:-5000}
    networks:
      - nexus-network
    # ✅ FIX #11: healthcheck pakai Python (curl tidak ada di python:slim)
    healthcheck:
      test:
        - "CMD-SHELL"
        - "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:${PORT:-5000}/health', timeout=5).status == 200 else 1)\""
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:alpine
    container_name: nexus-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-5008}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./static:/static:ro
    depends_on:
      nexus-iot:
        condition: service_healthy
    networks:
      - nexus-network
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  nexus-network:
    driver: bridge