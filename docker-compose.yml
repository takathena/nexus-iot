# docker-compose.yml
version: '3.8'

services:
  # Flask dengan Gunicorn
  nexus-iot:
    build: .
    container_name: nexus-iot
    restart: unless-stopped
    expose:
      - "5000"
    volumes:
      - ./database:/app/database
      - ./.env:/app/.env:ro
      - ./static:/app/static:ro
    environment:
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
    networks:
      - nexus-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/login"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: nexus-nginx
    restart: unless-stopped
    ports:
      - "5008:80"  # Ubah dari "80:80" menjadi "5008:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./static:/static:ro
    depends_on:
      - nexus-iot
    networks:
      - nexus-network
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  nexus-network:
    driver: bridge