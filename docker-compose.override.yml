# Override khusus DEVELOPMENT: mount kode agar perubahan langsung terlihat.
# `docker compose up` memuat file ini otomatis. Untuk PRODUKSI jalankan tanpa override:
#   docker compose -f docker-compose.yml up -d --build      (atau: make docker-up)
services:
  nexus-iot:
    volumes:
      - ./templates:/app/templates:ro
      - ./static:/app/static:ro
      - ./app:/app/app:ro
      - ./run.py:/app/run.py:ro
