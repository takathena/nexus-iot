{% extends "base.html" %}

{% block title %}Masuk — NEXUS{% endblock %}

{% block extra_css %}
<style>
    body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        min-height: 100vh;
        min-height: 100dvh;
    }

    body::before {
        inset: -20%;
        background:
            radial-gradient(38% 30% at 22% 20%, rgba(10,132,255,.16), transparent 65%),
            radial-gradient(32% 26% at 82% 78%, rgba(191,90,242,.12), transparent 65%),
            radial-gradient(45% 40% at 50% 100%, rgba(10,132,255,.06), transparent 70%);
        filter: blur(60px);
        animation: drift 18s ease-in-out infinite alternate;
    }

    @keyframes drift {
        0% { transform: translate3d(0,0,0) scale(1); }
        100% { transform: translate3d(-2%,2%,0) scale(1.06); }
    }

    .login-card {
        position: relative;
        z-index: 2;
        width: 100%;
        max-width: 400px;
        background: var(--surface);
        backdrop-filter: blur(40px) saturate(180%);
        -webkit-backdrop-filter: blur(40px) saturate(180%);
        border: 1px solid var(--hairline);
        border-radius: 24px;
        padding: 36px 28px 28px;
        box-shadow: var(--shadow-lg);
        animation: rise .6s var(--ease);
        margin: auto;
    }

    [data-theme="light"] .login-card {
        background: #ffffff;
        box-shadow: 0 30px 80px rgba(0,0,0,.15), inset 0 1px 0 rgba(255,255,255,.5);
    }

    .login-mark {
        width: 52px;
        height: 52px;
        margin: 0 auto 18px;
        border-radius: 15px;
        background: linear-gradient(155deg, #2c2c2e, #111113);
        border: 1px solid var(--hairline);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        color: var(--blue);
        box-shadow: 0 8px 24px rgba(10,132,255,.18);
    }

    [data-theme="light"] .login-mark {
        background: linear-gradient(155deg, #e5e5ea, #d1d1d6);
    }

    .login-title {
        text-align: center;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -.02em;
        margin-bottom: 4px;
        color: var(--text);
    }

    .login-sub {
        text-align: center;
        font-size: 12.5px;
        color: var(--text-3);
        margin-bottom: 24px;
        font-weight: 500;
    }

    .login-error {
        display: flex;
        align-items: center;
        gap: 9px;
        background: rgba(255,69,58,.1);
        border: 1px solid rgba(255,69,58,.22);
        color: #ff8078;
        border-radius: 12px;
        padding: 10px 13px;
        font-size: 12px;
        font-weight: 600;
        margin-bottom: 16px;
        animation: shake .35s;
    }

    @keyframes shake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-4px); }
        75% { transform: translateX(4px); }
    }

    .login-field { margin-bottom: 13px; }

    .login-field label {
        display: block;
        font-size: 10.5px;
        font-weight: 600;
        color: var(--text-3);
        text-transform: uppercase;
        letter-spacing: .06em;
        margin-bottom: 6px;
        padding-left: 2px;
    }

    .login-field-wrap { position: relative; }

    .login-field-wrap i {
        position: absolute;
        left: 14px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-3);
        font-size: 13px;
        pointer-events: none;
        z-index: 1;
    }

    .login-field-wrap input {
        width: 100%;
        background: rgba(255,255,255,.045);
        border: 1px solid var(--hairline);
        border-radius: 12px;
        padding: 12px 14px 12px 40px;
        font-size: 14px;
        font-family: inherit;
        color: var(--text);
        outline: none;
        transition: border-color .2s, background .2s, box-shadow .2s;
        -webkit-appearance: none;
        appearance: none;
    }

    [data-theme="light"] .login-field-wrap input { background: rgba(0,0,0,.04); }
    .login-field-wrap input::placeholder { color: var(--text-3); }

    .login-field-wrap input:focus {
        border-color: rgba(10,132,255,.6);
        background: rgba(10,132,255,.06);
        box-shadow: 0 0 0 4px rgba(10,132,255,.14);
        font-size: 16px;
    }

    .login-submit {
        width: 100%;
        margin-top: 8px;
        padding: 13px;
        border: none;
        border-radius: 12px;
        background: var(--blue);
        color: #fff;
        font-size: 14px;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        transition: transform .15s, background .2s, box-shadow .2s;
        box-shadow: 0 8px 20px rgba(10,132,255,.28);
    }

    .login-submit:hover {
        background: var(--blue-hover);
        box-shadow: 0 10px 26px rgba(10,132,255,.36);
    }

    .login-submit:active { transform: scale(.97); }

    .login-foot {
        text-align: center;
        margin-top: 20px;
        font-size: 10.5px;
        color: var(--text-3);
    }

    @media (max-width: 480px) {
        .login-card {
            max-width: 100%;
            border-radius: 20px;
            padding: 28px 20px 22px;
        }
        .login-mark { width: 46px; height: 46px; font-size: 18px; margin-bottom: 14px; }
        .login-title { font-size: 18px; }
        .login-sub { font-size: 11.5px; margin-bottom: 20px; }
    }
</style>
{% endblock %}

{% block content %}
<div class="login-card">
    <div class="login-mark">
        <i class="fa-solid fa-satellite-dish"></i>
    </div>
    <h1 class="login-title">NEXUS</h1>
    <p class="login-sub">Masuk untuk mengelola perangkat Anda</p>

    {% if error %}
    <div class="login-error">
        <i class="fa-solid fa-circle-exclamation"></i>{{ error }}
    </div>
    {% endif %}

    <form method="POST" action="/login" autocomplete="on">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="login-field">
            <label for="username">Username</label>
            <div class="login-field-wrap">
                <i class="fa-regular fa-user"></i>
                <input type="text" id="username" name="username" placeholder="admin" required autofocus autocomplete="username" spellcheck="false">
            </div>
        </div>

        <div class="login-field">
            <label for="password">Password</label>
            <div class="login-field-wrap">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
            </div>
        </div>

        <button type="submit" class="login-submit">
            Masuk <i class="fa-solid fa-arrow-right" style="font-size:12px;"></i>
        </button>
    </form>

    <div class="login-foot">NEXUS IoT Platform &nbsp;·&nbsp; 2026</div>
</div>
{% endblock %}
