{% extends "base.html" %}

{% block title %}Masuk — NEXUS{% endblock %}

{% block extra_css %}
<style>
    /* ==========================================================
       NEXUS — Login (Sure style)
       Clean, minimal, monochrome
       ========================================================== */

    body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        min-height: 100vh;
        min-height: 100dvh;
        position: relative;
        overflow: hidden;
        background: var(--bg);
    }

    /* ---------- Card ---------- */
    .login-card {
        position: relative;
        z-index: 2;
        width: 100%;
        max-width: 400px;
        background: var(--surface);
        border: 1px solid var(--hairline);
        border-radius: var(--radius-xl);
        padding: 32px 26px 26px;
        box-shadow: none;
        margin: auto;
        animation: rise .35s var(--ease);
    }

    /* ---------- Logo mark ---------- */
    .login-mark {
        width: 52px;
        height: 52px;
        margin: 0 auto 18px;
        border-radius: var(--radius-lg);
        background: var(--surface);
        border: 1px solid var(--hairline);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        color: var(--text);
    }

    /* ---------- Text ---------- */
    .login-title {
        text-align: center;
        font-family: var(--font-display);
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.03em;
        margin-bottom: 4px;
        color: var(--text);
    }

    .login-sub {
        text-align: center;
        font-size: 12.5px;
        color: var(--text-3);
        margin-bottom: 26px;
        font-weight: 400;
        letter-spacing: -0.005em;
    }

    /* ---------- Error ---------- */
    .login-error {
        display: flex;
        align-items: center;
        gap: 9px;
        background: var(--accent-crit-bg);
        border: 1px solid var(--accent-crit);
        color: var(--accent-crit);
        border-radius: var(--radius-md);
        padding: 10px 12px;
        font-size: 12.5px;
        font-weight: 500;
        margin-bottom: 18px;
        animation: shake .35s var(--ease);
    }
    .login-error i { font-size: 13px; flex-shrink: 0; }

    @keyframes shake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-4px); }
        75% { transform: translateX(4px); }
    }

    /* ---------- Field ---------- */
    .login-field { margin-bottom: 14px; }

    .login-field label {
        display: block;
        font-size: 11px;
        font-weight: 500;
        color: var(--text-2);
        letter-spacing: -0.005em;
        margin-bottom: 6px;
        padding-left: 2px;
    }

    .login-field-wrap { position: relative; }

    .login-field-wrap > i {
        position: absolute;
        left: 13px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-3);
        font-size: 13px;
        pointer-events: none;
        z-index: 1;
        transition: color 0.15s;
    }

    .login-field-wrap input {
        width: 100%;
        background: var(--surface);
        border: 1px solid var(--hairline);
        border-radius: var(--radius-md);
        padding: 11px 13px 11px 38px;
        font-size: 13.5px;
        font-family: inherit;
        color: var(--text);
        outline: none;
        transition: border-color 0.15s var(--ease), box-shadow 0.15s var(--ease);
        -webkit-appearance: none;
        appearance: none;
    }

    .login-field-wrap input::placeholder {
        color: var(--text-3);
    }

    .login-field-wrap input:hover {
        border-color: var(--text-3);
    }

    .login-field-wrap input:focus {
        border-color: var(--text-3);
        box-shadow: 0 0 0 3px rgba(163, 163, 163, 0.12);
    }

    .login-field-wrap:focus-within > i {
        color: var(--text-2);
    }

    /* ---------- Submit ---------- */
    .login-submit {
        width: 100%;
        margin-top: 8px;
        padding: 12px;
        border: none;
        border-radius: var(--radius-md);
        background: var(--primary);
        color: var(--primary-fg);
        font-size: 13.5px;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        letter-spacing: -0.01em;
        transition: background 0.15s var(--ease), opacity 0.15s var(--ease);
        min-height: 44px;
    }

    .login-submit:hover {
        background: var(--primary-hover);
    }

    .login-submit:active {
        opacity: 0.85;
    }

    .login-submit i {
        font-size: 11px;
        transition: transform 0.15s var(--ease);
    }

    .login-submit:hover i {
        transform: translateX(2px);
    }

    /* ---------- Footer ---------- */
    .login-foot {
        text-align: center;
        margin-top: 20px;
        font-size: 11px;
        color: var(--text-3);
        font-weight: 400;
        letter-spacing: -0.005em;
    }

    .login-foot span {
        color: var(--text-3);
        opacity: 0.6;
        margin: 0 6px;
    }

    /* ---------- Responsive ---------- */
    @media (max-width: 480px) {
        body { padding: 16px; }
        .login-card {
            border-radius: var(--radius-lg);
            padding: 26px 20px 22px;
        }
        .login-mark { width: 46px; height: 46px; font-size: 18px; margin-bottom: 16px; }
        .login-title { font-size: 20px; }
        .login-sub { font-size: 12px; margin-bottom: 22px; }
        .login-field-wrap input { padding: 10px 13px 10px 36px; font-size: 14px; }
        .login-submit { padding: 11px; min-height: 42px; }
    }
</style>
{% endblock %}

{% block content %}
<div class="login-card">
    <div class="login-mark">
        <i class="fa-solid fa-satellite-dish"></i>
    </div>
    <h1 class="login-title">NEXUS</h1>
    <p class="login-sub">Masuk untuk mengelola perangkat Anda</p>

    {% if error %}
    <div class="login-error">
        <i class="fa-solid fa-circle-exclamation"></i>
        <span>{{ error }}</span>
    </div>
    {% endif %}

    <form method="POST" action="/login" autocomplete="on">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="login-field">
            <label for="username">Username</label>
            <div class="login-field-wrap">
                <i class="fa-regular fa-user"></i>
                <input type="text" id="username" name="username" placeholder="admin" required autofocus autocomplete="username" spellcheck="false" autocapitalize="off">
            </div>
        </div>

        <div class="login-field">
            <label for="password">Password</label>
            <div class="login-field-wrap">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
            </div>
        </div>

        <button type="submit" class="login-submit">
            Masuk <i class="fa-solid fa-arrow-right"></i>
        </button>
    </form>
</div>
{% endblock %}
