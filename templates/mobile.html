<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEXUS IoT - Mobile</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-card: rgba(30, 41, 59, 0.7);
            --bg-glass: rgba(255, 255, 255, 0.03);
            --border-glass: rgba(255, 255, 255, 0.08);
            --accent-cyan: #06b6d4;
            --accent-purple: #8b5cf6;
            --accent-emerald: #10b981;
            --accent-rose: #f43f5e;
            --accent-amber: #f59e0b;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--border-glass);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 8px 0;
            z-index: 100;
            height: 60px;
        }

        .bottom-nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            cursor: pointer;
            color: var(--text-muted);
            transition: all 0.3s;
            font-size: 9px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            flex: 1;
        }

        .bottom-nav-item i { font-size: 18px; transition: all 0.3s; }
        .bottom-nav-item.active { color: var(--accent-cyan); }
        .bottom-nav-item.active i { transform: translateY(-3px); text-shadow: 0 0 20px rgba(6, 182, 212, 0.5); }

        .mobile-header {
            position: sticky;
            top: 0;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-glass);
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 50;
        }

        .mobile-header h1 { font-size: 16px; font-weight: 800; }
        .mobile-header .time { font-size: 12px; font-weight: 700; color: var(--accent-cyan); }

        .mobile-content { padding: 20px; padding-bottom: 80px; }
        .mobile-stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 20px; }

        .mobile-stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            border-radius: 15px;
            padding: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .mobile-stat-icon {
            width: 38px; height: 38px;
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
        }

        .mobile-stat-icon.total { background: rgba(139, 92, 246, 0.2); color: #a78bfa; }
        .mobile-stat-icon.online { background: rgba(16, 185, 129, 0.2); color: #34d399; }
        .mobile-stat-icon.offline { background: rgba(244, 63, 94, 0.2); color: #fb7185; }
        .mobile-stat-icon.alerts { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }

        .mobile-stat-info h3 { font-size: 9px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 3px; }
        .mobile-stat-info .value { font-size: 20px; font-weight: 800; }

        .device-list { display: flex; flex-direction: column; gap: 10px; }

        .device-card {
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            border-radius: 15px;
            padding: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .device-card:active { transform: scale(0.97); }
        .device-card .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .device-card .device-name { font-size: 14px; font-weight: 700; }
        .device-card .device-id { font-size: 10px; color: var(--text-muted); font-family: monospace; }

        .status-badge {
            display: inline-flex; align-items: center; gap: 4px;
            padding: 3px 8px; border-radius: 20px;
            font-size: 9px; font-weight: 700; text-transform: uppercase;
        }
        .status-badge.online { background: rgba(16, 185, 129, 0.1); color: #34d399; }
        .status-badge.offline { background: rgba(244, 63, 94, 0.1); color: #fb7185; }
        .status-dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
        .status-badge.online .status-dot { animation: pulse 2s infinite; }

        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        .device-card .device-info { display: flex; gap: 12px; font-size: 10px; color: var(--text-muted); flex-wrap: wrap; }

        .section-title { font-size: 15px; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
        .section-title i { color: var(--accent-cyan); }

                #mobileMap { height: 220px; border-radius: 15px; border: 1px solid var(--border-glass); overflow: hidden; margin-bottom: 20px; position: relative; z-index: 1; }

        .fab {
            position: fixed;
            bottom: 75px; right: 15px;
            width: 50px; height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
            box-shadow: 0 8px 30px rgba(6, 182, 212, 0.4);
            display: flex; align-items: center; justify-content: center;
            transition: all 0.3s;
            z-index: 90;
        }
        .fab:active { transform: scale(0.9); }

        .mobile-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            z-index: 9999;
            align-items: flex-end;
            justify-content: center;
        }
        .mobile-modal.active { display: flex; }

        .mobile-modal-content {
            background: var(--bg-secondary);
            border: 1px solid var(--border-glass);
            border-radius: 20px 20px 0 0;
            padding: 20px;
            width: 100%;
            max-width: 500px;
            max-height: 80vh;
            overflow-y: auto;
            animation: slideUp 0.3s ease;
            position: relative;
            z-index: 10000;
        }

        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 10px; font-weight: 700; margin-bottom: 5px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
        .form-group input, .form-group select { width: 100%; padding: 11px; background: var(--bg-glass); border: 1px solid var(--border-glass); border-radius: 10px; font-size: 14px; font-family: inherit; color: var(--text-primary); outline: none; }

        .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
        .btn { flex: 1; padding: 12px; border: none; border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit; }
        .btn-primary { background: var(--accent-cyan); color: white; }
        .btn-secondary { background: var(--border-glass); color: var(--text-primary); }
        .btn-success { background: var(--accent-emerald); color: white; }

        .loading-state { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px; gap: 10px; color: var(--text-muted); }
        .spinner { width: 30px; height: 30px; border: 3px solid var(--border-glass); border-top-color: var(--accent-cyan); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="mobile-header">
        <h1>📡 NEXUS IoT</h1>
        <div class="time" id="mobileTime"></div>
    </div>

    <div class="mobile-content">
        <div id="mDashboardSection">
            <div class="mobile-stats">
                <div class="mobile-stat-card">
                    <div class="mobile-stat-icon total"><i class="fas fa-microchip"></i></div>
                    <div class="mobile-stat-info"><h3>Total</h3><div class="value" id="mTotalDevices">0</div></div>
                </div>
                <div class="mobile-stat-card">
                    <div class="mobile-stat-icon online"><i class="fas fa-wifi"></i></div>
                    <div class="mobile-stat-info"><h3>Online</h3><div class="value" id="mOnlineDevices">0</div></div>
                </div>
                <div class="mobile-stat-card">
                    <div class="mobile-stat-icon offline"><i class="fas fa-power-off"></i></div>
                    <div class="mobile-stat-info"><h3>Offline</h3><div class="value" id="mOfflineDevices">0</div></div>
                </div>
                <div class="mobile-stat-card">
                    <div class="mobile-stat-icon alerts"><i class="fas fa-bell"></i></div>
                    <div class="mobile-stat-info"><h3>Alert</h3><div class="value" id="mActiveAlerts">0</div></div>
                </div>
            </div>

            <div class="section-title"><i class="fas fa-map-marker-alt"></i> Peta Lokasi</div>
            <div id="mobileMap"></div>

            <div class="section-title"><i class="fas fa-list"></i> Daftar Perangkat</div>
            <div class="device-list" id="mDeviceList">
                <div class="loading-state"><div class="spinner"></div><div>Memuat...</div></div>
            </div>
        </div>

        <div id="mDevicesSection" style="display: none;">
            <div class="section-title"><i class="fas fa-server"></i> Semua Perangkat</div>
            <div class="device-list" id="mDeviceListFull">
                <div class="loading-state"><div class="spinner"></div><div>Memuat...</div></div>
            </div>
        </div>
    </div>

    <button class="fab" onclick="openAddModal()"><i class="fas fa-plus"></i></button>

    <div class="bottom-nav">
        <div class="bottom-nav-item active" onclick="showMSection('dashboard')"><i class="fas fa-chart-pie"></i><span>Dashboard</span></div>
        <div class="bottom-nav-item" onclick="showMSection('devices')"><i class="fas fa-server"></i><span>Perangkat</span></div>
        <div class="bottom-nav-item" onclick="window.location.href='/'"><i class="fas fa-desktop"></i><span>Desktop</span></div>
        <div class="bottom-nav-item" onclick="logoutM()" style="color: #fb7185;"><i class="fas fa-sign-out-alt"></i><span>Logout</span></div>
    </div>

    <div class="mobile-modal" id="mAddModal">
        <div class="mobile-modal-content">
            <h3 style="margin-bottom: 15px; font-size: 16px;">➕ Tambah Perangkat</h3>
            <div class="form-group"><label>Device ID</label><input type="text" id="mAddId" placeholder="ESP32-001"></div>
            <div class="form-group"><label>Nama</label><input type="text" id="mAddName" placeholder="Sensor Suhu"></div>
            <div class="form-group"><label>Tipe</label><select id="mAddType"><option>ESP32</option><option>ESP8266</option><option>Arduino</option><option>Other</option></select></div>
            <div class="form-group"><label>Lokasi</label><input type="text" id="mAddLocation" placeholder="Ruang Server"></div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeAddModal()">Batal</button>
                <button class="btn btn-success" onclick="addMobileDevice()">Simpan</button>
            </div>
        </div>
    </div>

    <div class="mobile-modal" id="mApiKeyModal">
        <div class="mobile-modal-content">
            <h3 style="margin-bottom: 10px; font-size: 16px;">🔑 API Key</h3>
            <p style="font-size: 12px; color: var(--text-secondary); margin-bottom: 10px;">Simpan API Key ini:</p>
            <div style="background: var(--bg-glass); border: 1px solid var(--border-glass); border-radius: 10px; padding: 10px; display: flex; gap: 8px;">
                <code id="mApiKeyDisplay" style="flex: 1; font-size: 11px; color: var(--accent-cyan); word-break: break-all;"></code>
                <button class="btn btn-primary" style="flex: 0 0 auto; padding: 8px 10px; font-size: 11px;" onclick="copyMApiKey()">Copy</button>
            </div>
            <button class="btn btn-primary" style="width: 100%; margin-top: 15px;" onclick="closeApiKeyModal()">OK, Saya Sudah Simpan</button>
        </div>
    </div>

    <script>
        let mMap;
        let mDevices = [];

        function logoutM() {
            window.location.href = '/logout';
        }

        function updateMobileTime() {
            const now = new Date();
            document.getElementById('mobileTime').textContent = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', timeZone: 'Asia/Jakarta' }) + ' WIB';
        }
        updateMobileTime();
        setInterval(updateMobileTime, 1000);

        function showMSection(section) {
            document.getElementById('mDashboardSection').style.display = section === 'dashboard' ? 'block' : 'none';
            document.getElementById('mDevicesSection').style.display = section === 'devices' ? 'block' : 'none';
            document.querySelectorAll('.bottom-nav-item').forEach((item, i) => {
                item.classList.toggle('active', i === (section === 'dashboard' ? 0 : 1));
            });
        }

        function initMobileMap() {
            mMap = L.map('mobileMap', { zoomControl: true }).setView([-2.5489, 118.0149], 5);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(mMap);
        }

        function loadMMarkers() {
            mDevices.forEach(d => {
                if (d.latitude && d.longitude) {
                    const color = d.status === 'online' ? '#10b981' : '#ef4444';
                    L.circleMarker([d.latitude, d.longitude], { radius: 7, color, fillColor: color, fillOpacity: 0.7 })
                        .addTo(mMap).bindPopup(`<b>${d.device_name}</b><br>${d.device_id}`);
                }
            });
        }

        function formatMUptime(seconds) {
            if (!seconds) return '-';
            const d = Math.floor(seconds / 86400);
            const h = Math.floor((seconds % 86400) / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            if (d > 0) return `${d}h ${h}j`;
            if (h > 0) return `${h}j ${m}m`;
            return `${m}m`;
        }

        async function loadMDashboard() {
            try {
                const res = await fetch('/api/v1/dashboard');
                const data = await res.json();
                if (data.success) {
                    mDevices = data.devices;
                    document.getElementById('mTotalDevices').textContent = data.summary.total_devices;
                    document.getElementById('mOnlineDevices').textContent = data.summary.online_devices;
                    document.getElementById('mOfflineDevices').textContent = data.summary.offline_devices;
                    loadMMarkers();
                    renderMDeviceList(data.devices, 'mDeviceList');
                    renderMDeviceList(data.devices, 'mDeviceListFull');
                    
                    // Muat device tersimpan dari localStorage
                    const savedDevice = localStorage.getItem('selectedDeviceId');
                    if (savedDevice) {
                        // Jika ada device tersimpan, scroll ke device tersebut
                        const deviceCard = document.querySelector(`.device-card[data-device-id="${savedDevice}"]`);
                        if (deviceCard) {
                            deviceCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
                            deviceCard.style.borderColor = 'var(--accent-cyan)';
                            deviceCard.style.boxShadow = '0 0 20px rgba(6, 182, 212, 0.3)';
                        }
                    }
                }
            } catch (e) { console.error(e); }
        }

        function renderMDeviceList(devices, elementId) {
            const container = document.getElementById(elementId);
            if (devices.length === 0) {
                container.innerHTML = '<div style="text-align: center; padding: 30px; color: var(--text-muted); font-size: 13px;">Belum ada perangkat</div>';
                return;
            }
            container.innerHTML = '';
            devices.forEach(d => {
                const uptime = formatMUptime(d.latest_uptime_seconds || 0);
                const wifi = d.latest_wifi_ssid || '-';
                const card = document.createElement('div');
                card.className = 'device-card';
                card.onclick = () => viewMDevice(d.device_id);
                card.innerHTML = `
                    <div class="card-header">
                        <div>
                            <div class="device-name">${d.device_name}</div>
                            <div class="device-id">${d.device_id}</div>
                        </div>
                        <span class="status-badge ${d.status}"><span class="status-dot"></span>${d.status}</span>
                    </div>
                    <div class="device-info">
                        <span>📶 ${wifi}</span>
                        <span>⏱ ${uptime}</span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function viewMDevice(id) { window.location.href = `/device/${id}`; }

        function openAddModal() { document.getElementById('mAddModal').classList.add('active'); }
        function closeAddModal() { document.getElementById('mAddModal').classList.remove('active'); }
        function openApiKeyModal() { document.getElementById('mApiKeyModal').classList.add('active'); }
        function closeApiKeyModal() { document.getElementById('mApiKeyModal').classList.remove('active'); }

        async function addMobileDevice() {
            const deviceId = document.getElementById('mAddId').value.trim();
            const deviceName = document.getElementById('mAddName').value.trim();
            if (!deviceId || !deviceName) { alert('ID dan Nama wajib!'); return; }
            try {
                const res = await fetch('/api/v1/devices', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ device_id: deviceId, device_name: deviceName, device_type: document.getElementById('mAddType').value, location: document.getElementById('mAddLocation').value })
                });
                const data = await res.json();
                if (data.success) {
                    closeAddModal();
                    document.getElementById('mAddId').value = '';
                    document.getElementById('mAddName').value = '';
                    document.getElementById('mAddLocation').value = '';
                    document.getElementById('mApiKeyDisplay').textContent = data.device.api_key;
                    openApiKeyModal();
                    loadMDashboard();
                } else alert(data.error);
            } catch (e) { alert('Error'); }
        }

        function copyMApiKey() {
            const apiKey = document.getElementById('mApiKeyDisplay').textContent;
            if (navigator.clipboard) {
                navigator.clipboard.writeText(apiKey);
            } else {
                const textarea = document.createElement('textarea');
                textarea.value = apiKey;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
            }
            alert('API Key disalin!');
        }

        initMobileMap();
        loadMDashboard();
        setInterval(loadMDashboard, 30000);
    </script>
</body>
</html>
