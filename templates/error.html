<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ code }} — {{ title }}</title>
    <style>
        :root { color-scheme: dark; }
        body {
            margin: 0; min-height: 100vh; display: flex; align-items: center;
            justify-content: center; background: #0d1117; color: #e6edf3;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .box { text-align: center; padding: 40px; max-width: 420px; }
        .code { font-size: 52px; font-weight: 700; letter-spacing: -2px; margin: 0; }
        .title { font-size: 18px; margin: 12px 0 6px; }
        .message { color: #9aa7b4; font-size: 14px; line-height: 1.5; margin: 0 0 24px; }
        a.btn {
            display: inline-block; padding: 10px 20px; border-radius: 8px;
            background: #238636; color: #fff; text-decoration: none; font-size: 14px;
        }
        a.btn:hover { background: #2ea043; }
    </style>
</head>
<body>
    <div class="box">
        <p class="code">{{ code }}</p>
        <p class="title">{{ title }}</p>
        <p class="message">{{ message }}</p>
        <a class="btn" href="/">Kembali ke Dashboard</a>
    </div>
</body>
</html>
