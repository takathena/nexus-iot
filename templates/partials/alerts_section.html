<div id="alertsSection">

    <div class="nx-metrics nx-metrics--4">

        <div class="nx-metric-card">
            <div class="nx-metric-head">
                <span class="nx-metric-title">Total Aktif</span>
                <div class="nx-metric-menu">
                    <button class="nx-metric-menu-btn" type="button" aria-label="Menu">
                        <i class="fa-solid fa-ellipsis-vertical"></i>
                    </button>
                    <div class="nx-metric-menu__list">
                        <button class="nx-metric-menu__item" data-action="filter-status" data-key="statTotalActive" data-value="all">
                            <i class="fa-regular fa-eye"></i> Lihat semua
                        </button>
                        <button class="nx-metric-menu__item" data-action="copy" data-key="statTotalActive">
                            <i class="fa-regular fa-copy"></i> Salin nilai
                        </button>
                    </div>
                </div>
            </div>
            <div class="nx-metric-body">
                <div class="nx-metric-value" id="statTotalActive" data-value="statTotalActive">0</div>
                <div class="nx-metric-spark" data-spark="statTotalActive"></div>
            </div>
            <div class="nx-metric-foot">
                <span class="nx-metric-trend neutral" data-trend="statTotalActive">
                    <i class="fa-solid fa-minus"></i> 0%
                </span>
                <span class="nx-metric-trend-label" data-trend-label="statTotalActive">vs 24 jam lalu</span>
            </div>
        </div>

        <div class="nx-metric-card">
            <div class="nx-metric-head">
                <span class="nx-metric-title">Bahaya</span>
                <div class="nx-metric-menu">
                    <button class="nx-metric-menu-btn" type="button" aria-label="Menu">
                        <i class="fa-solid fa-ellipsis-vertical"></i>
                    </button>
                    <div class="nx-metric-menu__list">
                        <button class="nx-metric-menu__item" data-action="filter-severity" data-key="statDanger" data-value="danger">
                            <i class="fa-solid fa-filter"></i> Filter bahaya
                        </button>
                        <button class="nx-metric-menu__item" data-action="copy" data-key="statDanger">
                            <i class="fa-regular fa-copy"></i> Salin nilai
                        </button>
                    </div>
                </div>
            </div>
            <div class="nx-metric-body">
                <div class="nx-metric-value crit" id="statDanger" data-value="statDanger">0</div>
                <div class="nx-metric-spark" data-spark="statDanger"></div>
            </div>
            <div class="nx-metric-foot">
                <span class="nx-metric-trend neutral" data-trend="statDanger">
                    <i class="fa-solid fa-minus"></i> 0%
                </span>
                <span class="nx-metric-trend-label" data-trend-label="statDanger">vs 24 jam lalu</span>
            </div>
        </div>

        <div class="nx-metric-card">
            <div class="nx-metric-head">
                <span class="nx-metric-title">Peringatan</span>
                <div class="nx-metric-menu">
                    <button class="nx-metric-menu-btn" type="button" aria-label="Menu">
                        <i class="fa-solid fa-ellipsis-vertical"></i>
                    </button>
                    <div class="nx-metric-menu__list">
                        <button class="nx-metric-menu__item" data-action="filter-severity" data-key="statWarning" data-value="warning">
                            <i class="fa-solid fa-filter"></i> Filter peringatan
                        </button>
                        <button class="nx-metric-menu__item" data-action="copy" data-key="statWarning">
                            <i class="fa-regular fa-copy"></i> Salin nilai
                        </button>
                    </div>
                </div>
            </div>
            <div class="nx-metric-body">
                <div class="nx-metric-value warn" id="statWarning" data-value="statWarning">0</div>
                <div class="nx-metric-spark" data-spark="statWarning"></div>
            </div>
            <div class="nx-metric-foot">
                <span class="nx-metric-trend neutral" data-trend="statWarning">
                    <i class="fa-solid fa-minus"></i> 0%
                </span>
                <span class="nx-metric-trend-label" data-trend-label="statWarning">vs 24 jam lalu</span>
            </div>
        </div>

        <div class="nx-metric-card">
            <div class="nx-metric-head">
                <span class="nx-metric-title">Info</span>
                <div class="nx-metric-menu">
                    <button class="nx-metric-menu-btn" type="button" aria-label="Menu">
                        <i class="fa-solid fa-ellipsis-vertical"></i>
                    </button>
                    <div class="nx-metric-menu__list">
                        <button class="nx-metric-menu__item" data-action="filter-severity" data-key="statInfo" data-value="info">
                            <i class="fa-solid fa-filter"></i> Filter info
                        </button>
                        <button class="nx-metric-menu__item" data-action="copy" data-key="statInfo">
                            <i class="fa-regular fa-copy"></i> Salin nilai
                        </button>
                    </div>
                </div>
            </div>
            <div class="nx-metric-body">
                <div class="nx-metric-value info" id="statInfo" data-value="statInfo">0</div>
                <div class="nx-metric-spark" data-spark="statInfo"></div>
            </div>
            <div class="nx-metric-foot">
                <span class="nx-metric-trend neutral" data-trend="statInfo">
                    <i class="fa-solid fa-minus"></i> 0%
                </span>
                <span class="nx-metric-trend-label" data-trend-label="statInfo">vs 24 jam lalu</span>
            </div>
        </div>

    </div>

    <div class="alert-trend-card" id="alertTrendCard">
        <div class="alert-trend-header">
            <div class="alert-trend-title">
                <i class="fa-solid fa-chart-column"></i>
                <span>Trend Alert</span>
            </div>
            <div class="alert-trend-range" id="alertTrendRange">
                <button class="trend-range-btn active" data-hours="24">24 Jam</button>
                <button class="trend-range-btn" data-hours="168">7 Hari</button>
            </div>
        </div>
        <div class="alert-trend-body">
            <canvas id="alertTrendCanvas"></canvas>
            <div class="alert-trend-empty" id="alertTrendEmpty" style="display:none;">
                <i class="fa-solid fa-chart-simple"></i>
                <span>Belum ada data trend</span>
            </div>
        </div>
    </div>

    <div class="alert-toolbar">
        <div class="alert-filters">

            <div class="ios-dropdown" id="alertStatusDropdown" data-value="all">
                <button type="button" class="ios-dropdown-trigger">
                    <i class="fa-solid fa-filter"></i>
                    <span class="ios-dropdown-label">Semua Status</span>
                    <i class="fa-solid fa-chevron-down ios-dropdown-chev"></i>
                </button>
                <div class="ios-dropdown-menu">
                    <button type="button" class="ios-dropdown-item active" data-value="all">
                        <i class="fa-solid fa-layer-group ios-dropdown-item-icon"></i>
                        <span class="ios-dropdown-item-label">Semua Status</span>
                        <i class="fa-solid fa-check ios-dropdown-check"></i>
                    </button>
                    <button type="button" class="ios-dropdown-item" data-value="active">
                        <i class="fa-solid fa-circle-exclamation ios-dropdown-item-icon"></i>
                        <span class="ios-dropdown-item-label">Aktif</span>
                        <i class="fa-solid fa-check ios-dropdown-check"></i>
                    </button>
                    <button type="button" class="ios-dropdown-item" data-value="resolved">
                        <i class="fa-solid fa-circle-check ios-dropdown-item-icon"></i>
                        <span class="ios-dropdown-item-label">Selesai</span>
                        <i class="fa-solid fa-check ios-dropdown-check"></i>
                    </button>
                </div>
            </div>

            <div class="ios-dropdown" id="alertSeverityDropdown" data-value="">
                <button type="button" class="ios-dropdown-trigger">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                    <span class="ios-dropdown-label">Semua Severity</span>
                    <i class="fa-solid fa-chevron-down ios-dropdown-chev"></i>
                </button>
                <div class="ios-dropdown-menu">
                    <button type="button" class="ios-dropdown-item active" data-value="">
                        <i class="fa-solid fa-layer-group ios-dropdown-item-icon"></i>
                        <span class="ios-dropdown-item-label">Semua Severity</span>
                        <i class="fa-solid fa-check ios-dropdown-check"></i>
                    </button>
                    <button type="button" class="ios-dropdown-item" data-value="danger">
                        <i class="fa-solid fa-fire ios-dropdown-item-icon"></i>
                        <span class="ios-dropdown-item-label">Bahaya</span>
                        <i class="fa-solid fa-check ios-dropdown-check"></i>
                    </button>
                    <button type="button" class="ios-dropdown-item" data-value="warning">
                        <i class="fa-solid fa-triangle-exclamation ios-dropdown-item-icon"></i>
                        <span class="ios-dropdown-item-label">Peringatan</span>
                        <i class="fa-solid fa-check ios-dropdown-check"></i>
                    </button>
                    <button type="button" class="ios-dropdown-item" data-value="info">
                        <i class="fa-solid fa-circle-info ios-dropdown-item-icon"></i>
                        <span class="ios-dropdown-item-label">Info</span>
                        <i class="fa-solid fa-check ios-dropdown-check"></i>
                    </button>
                </div>
            </div>

            <div class="alert-date-inline">
                <input type="date" id="alertStartDate" autocomplete="off" aria-label="Dari tanggal">
                <input type="date" id="alertEndDate" autocomplete="off" aria-label="Sampai tanggal">
                <button class="adf-reset" id="alertClearFilter" title="Reset filter tanggal" aria-label="Reset">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

        </div>

        <div class="alert-actions">
            <button class="btn btn-secondary" id="testNotifBtn" title="Kirim notifikasi tes ke Telegram">
                <i class="fa-solid fa-paper-plane"></i> Test Notif
            </button>
            <button class="btn btn-secondary" id="historyAlertsBtn" title="Lihat riwayat lengkap alert">
                <i class="fa-solid fa-clock-rotate-left"></i> Riwayat
            </button>
            <button class="btn btn-secondary" id="markAllReadBtn" title="Tandai semua alert yang tampil sebagai selesai">
                <i class="fa-solid fa-check-double"></i> Tandai Semua
            </button>
            <button class="btn btn-secondary" id="refreshAlertsBtn" title="Refresh">
                <i class="fa-solid fa-rotate"></i> Refresh
            </button>
        </div>
    </div>

    <div id="bulkActionBar" class="bulk-action-bar" style="display:none;">
        <div class="bulk-left">
            <label class="bulk-checkbox">
                <input type="checkbox" id="selectAllCheckbox">
                <span class="bulk-checkbox-box"></span>
                <span class="bulk-checkbox-text">Pilih Semua</span>
            </label>
            <span class="bulk-counter" id="selectedCounter">
                <i class="fa-solid fa-circle-check"></i>
                <span class="num" id="selectedCount">0</span>
                <span>dipilih</span>
            </span>
        </div>
        <button class="btn btn-success" id="bulkAckBtn">
            <i class="fa-solid fa-check-double"></i> Tandai Selesai
        </button>
    </div>

    <div class="section-card">
        <div class="section-body" style="padding:0;">
            <div id="alertsList">
                <div class="empty-state" style="padding:60px 20px;">
                    <i class="fa-solid fa-bell-slash" style="font-size:36px;color:var(--text-3);opacity:.3;"></i>
                    <h3 style="margin-top:12px;color:var(--text-3);">Memuat...</h3>
                </div>
            </div>
        </div>
    </div>

</div>
