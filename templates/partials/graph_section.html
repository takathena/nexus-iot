<div id="graphSection">
    <div class="section-card">
        <div class="analytics-header">
            <div class="analytics-left">
                <div class="tab-dropdown" id="tabDropdown">
                    <button class="tab-dropdown-trigger" id="tabDropdownTrigger">
                        <i class="fa-solid fa-layer-group"></i>
                        <span class="tab-label" id="tabDropdownLabel">Default</span>
                        <i class="fa-solid fa-chevron-down" style="font-size:10px;opacity:.6;"></i>
                    </button>
                    <div class="tab-dropdown-menu" id="tabDropdownMenu"></div>
                </div>
            </div>

            <div class="analytics-right">
                <div class="time-range-dropdown" id="timeRangeDropdown">
                    <button class="time-range-trigger" id="timeRangeTrigger">
                        <i class="fa-regular fa-clock"></i>
                        <span id="timeRangeLabel">24 Jam</span>
                        <i class="fa-solid fa-chevron-down" style="font-size:10px;opacity:.6;"></i>
                    </button>
                    <div class="time-range-menu" id="timeRangeMenu">
                        <div class="time-range-item" data-minutes="5"><i class="fa-regular fa-clock"></i> 5 Menit</div>
                        <div class="time-range-item" data-minutes="10"><i class="fa-regular fa-clock"></i> 10 Menit</div>
                        <div class="time-range-item" data-minutes="30"><i class="fa-regular fa-clock"></i> 30 Menit</div>
                        <div class="time-range-divider"></div>
                        <div class="time-range-item" data-minutes="60"><i class="fa-regular fa-hourglass-half"></i> 1 Jam</div>
                        <div class="time-range-item" data-minutes="180"><i class="fa-regular fa-hourglass-half"></i> 3 Jam</div>
                        <div class="time-range-item" data-minutes="360"><i class="fa-regular fa-hourglass-half"></i> 6 Jam</div>
                        <div class="time-range-item" data-minutes="720"><i class="fa-regular fa-hourglass"></i> 12 Jam</div>
                        <div class="time-range-divider"></div>
                        <div class="time-range-item active" data-minutes="1440"><i class="fa-regular fa-calendar"></i> 24 Jam</div>
                        <div class="time-range-item" data-minutes="10080"><i class="fa-regular fa-calendar-days"></i> 7 Hari</div>
                        <div class="time-range-item" data-minutes="43200"><i class="fa-regular fa-calendar"></i> 30 Hari</div>
                    </div>
                </div>
                <button class="btn btn-secondary" data-action="refresh-charts">
                    <i class="fa-solid fa-rotate"></i> Refresh
                </button>
                <button class="btn btn-secondary" data-action="reset-layout">
                    <i class="fa-solid fa-arrows-rotate"></i> Reset
                </button>
                <button class="btn btn-primary" data-action="add-chart">
                    <i class="fa-solid fa-plus"></i> Tambah Diagram
                </button>
            </div>
        </div>

        <div class="section-body">
            <div class="charts-grid-wrapper">
                <div class="charts-grid" id="chartsGrid">
                    <div class="empty-charts" style="text-align:center;padding:40px;color:var(--text-3);">
                        <i class="fa-solid fa-chart-column" style="font-size:40px;margin-bottom:12px;display:block;opacity:.4;"></i>
                        <p style="font-size:14px;font-weight:600;">Belum ada diagram di tab ini</p>
                        <p style="font-size:12px;margin-top:4px;">Klik "Tambah Diagram" untuk membuat visualisasi baru</p>
                    </div>
                </div>
                <div class="charts-grid-resize-handle" title="Drag untuk ubah tinggi kanvas"></div>

                <div class="charts-canvas-hint">
                    <i class="fa-solid fa-circle-info"></i>
                    <span>
                        Drag <b>header</b> pindah ·
                        Drag <b>sudut kanan-bawah</b> resize ·
                        Drag garis <b>—</b> ubah tinggi kanvas
                    </span>
                </div>
            </div>
        </div>
    </div>
</div>
