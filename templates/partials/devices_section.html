<div id="devicesSection">

    <div class="devices-toolbar">
        <div class="filter-bar" id="deviceFilterBarFull">
            <button class="filter-btn active" data-filter="all">
                <i class="fa-solid fa-server"></i>
                <span>Semua</span>
            </button>
            <button class="filter-btn" data-filter="online">
                <i class="fa-solid fa-wifi"></i>
                <span>Online</span>
            </button>
            <button class="filter-btn offline" data-filter="offline">
                <i class="fa-solid fa-power-off"></i>
                <span>Offline</span>
            </button>
            <button class="filter-btn warning" data-filter="alert">
                <i class="fa-solid fa-triangle-exclamation"></i>
                <span>Alert</span>
            </button>
        </div>
        <div class="nx-devices-actions">
            <button class="nx-btn nx-btn--primary" type="button" data-action="add-device" data-needs="editor">
                <i class="fa-solid fa-plus"></i>
                <span>Tambah perangkat</span>
            </button>
            <div class="nx-menu" data-needs="admin">
                <button class="nx-btn nx-btn--icon nx-btn--ghost" type="button" data-menu-trigger
                        title="Aksi lainnya" aria-label="Aksi lainnya">
                    <i class="fa-solid fa-ellipsis"></i>
                </button>
                <div class="nx-menu__list">
                    <button class="nx-menu__item" type="button" data-proxy="bulkImportBtn">Impor massal</button>
                </div>
            </div>
        </div>
    </div>

    <div class="section-card">
        <div class="section-body" style="padding:0;">
            <div class="table-wrapper">
                <table class="device-table">
                    <thead>
                        <tr>
                            <th>Status</th>
                            <th>ID</th>
                            <th>Nama</th>
                            <th>Tipe</th>
                            <th>WiFi</th>
                            <th>Uptime</th>
                            <th>Lokasi</th>
                            <th>Terakhir</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="deviceTableBodyFull">
                        <tr>
                            <td colspan="9" style="text-align:center;padding:40px;color:var(--text-3);">
                                Memuat...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</div>
