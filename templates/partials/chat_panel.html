<!-- ============================================================
     NEXUS AI CHAT — Right-side panel (minimizable)
     Tombol buka/tutup ada di topbar (id: chatToggleBtn)
     ============================================================ -->

<aside id="chatPanel" class="chat-panel" aria-hidden="true">
    <header class="chat-header">
        <div class="chat-brand">
            <div class="chat-avatar">
                <i class="fa-solid fa-robot"></i>
            </div>
            <div class="chat-brand-text">
                <div class="chat-title">NEXUS AI</div>
                <div class="chat-status" id="chatStatus">
                    <span class="chat-dot"></span>
                    <span id="chatStatusText">Menghubungkan…</span>
                </div>
            </div>
        </div>
        <div class="chat-header-actions">
            <button class="chat-icon-btn" onclick="NexusChat.clear()" title="Bersihkan percakapan">
                <i class="fa-solid fa-broom"></i>
            </button>
            <button class="chat-icon-btn" onclick="NexusChat.toggle()" title="Tutup panel">
                <i class="fa-solid fa-chevron-right"></i>
            </button>
        </div>
    </header>

    <div class="chat-messages" id="chatMessages">
        <div class="chat-welcome" id="chatWelcome">
            <div class="chat-welcome-icon">
                <i class="fa-solid fa-sparkles"></i>
            </div>
            <h4>Halo, saya NEXUS AI 👋</h4>
            <p>Tanyakan apa saja tentang perangkat, absensi, atau alert Anda.</p>

            <div class="chat-suggestions">
                <button class="chat-suggestion" data-q="Siapa yang tidak masuk hari ini?">
                    <i class="fa-solid fa-user-xmark"></i>
                    Siapa yang tidak masuk hari ini?
                </button>
                <button class="chat-suggestion" data-q="Bagaimana status semua perangkat?">
                    <i class="fa-solid fa-microchip"></i>
                    Status semua perangkat
                </button>
                <button class="chat-suggestion" data-q="Alert apa saja yang sedang aktif?">
                    <i class="fa-solid fa-bell"></i>
                    Alert yang aktif saat ini
                </button>
                <button class="chat-suggestion" data-q="Berapa karyawan yang hadir hari ini?">
                    <i class="fa-solid fa-user-check"></i>
                    Berapa yang hadir hari ini?
                </button>
            </div>
        </div>
    </div>

    <div class="chat-input-wrap">
        <textarea
            id="chatInput"
            placeholder="Tanya apa saja…"
            rows="1"
            autocomplete="off"
            autocorrect="off"
            spellcheck="false"></textarea>
        <button id="chatSend" class="chat-send" onclick="NexusChat.send()" aria-label="Kirim">
            <i class="fa-solid fa-arrow-up"></i>
        </button>
    </div>
</aside>

<div id="chatBackdrop" class="chat-backdrop" onclick="NexusChat.toggle()"></div>
