<aside id="chatPanel" class="chat-panel" aria-hidden="true">
    <header class="chat-header">
        <div class="chat-brand">
            <div class="chat-avatar">
                <i class="fa-solid fa-robot"></i>
            </div>
            <div class="chat-brand-text">
                <div class="chat-title">NEXUS AI</div>
                <div class="chat-status" id="chatStatus">
                    <span class="chat-dot"></span>
                    <span id="chatStatusText">Menghubungkan…</span>
                </div>
            </div>
        </div>
        <div class="chat-header-actions">
            <button class="chat-icon-btn" onclick="NexusChat.clear()" title="Bersihkan percakapan">
                <i class="fa-solid fa-broom"></i>
            </button>
            <button class="chat-icon-btn" onclick="NexusChat.toggle()" title="Tutup panel">
                <i class="fa-solid fa-chevron-right"></i>
            </button>
        </div>
    </header>

    <div class="chat-messages" id="chatMessages">
        <div class="chat-welcome" id="chatWelcome">
            <div class="chat-welcome-icon">
                <i class="fa-solid fa-wand-magic-sparkles"></i>
            </div>
            <h4>Selamat Datang di NEXUS</h4>
            <p>Tanyakan apa saja tentang perangkat, absensi, atau alert Anda.</p>

            <div class="chat-suggestions">
                <button class="chat-suggestion" data-q="Siapa yang tidak masuk hari ini?">
                    <i class="fa-solid fa-user-xmark"></i>
                    Siapa yang tidak masuk hari ini?
                </button>
                <button class="chat-suggestion" data-q="Bagaimana status semua perangkat?">
                    <i class="fa-solid fa-microchip"></i>
                    Status semua perangkat
                </button>
                <button class="chat-suggestion" data-q="Alert apa saja yang sedang aktif?">
                    <i class="fa-solid fa-bell"></i>
                    Alert yang aktif saat ini
                </button>
                <button class="chat-suggestion" data-q="Berapa karyawan yang hadir hari ini?">
                    <i class="fa-solid fa-user-check"></i>
                    Berapa yang hadir hari ini?
                </button>
            </div>
        </div>
    </div>

    <!-- ============================================================
         COMPOSER (mengikuti design Message action advanced)
         ============================================================ -->
    <div class="chat-composer" id="chatComposer">
        <textarea id="chatInput"
                  placeholder="Tanya apa saja…"
                  rows="1"
                  autocomplete="off" autocorrect="off" spellcheck="false"></textarea>

        <button class="chat-composer-mic" id="chatMicBtn" type="button" title="Voice input (segera)">
            <i class="fa-solid fa-microphone"></i>
        </button>

        <div class="chat-composer-bar">
            <button class="chat-composer-user" id="chatComposerUser" type="button" title="Identitas Anda">
                <span class="chat-composer-user-avatar">Y</span>
                <span class="chat-composer-user-name">You</span>
                <i class="fa-solid fa-chevron-down"></i>
            </button>

            <div class="chat-composer-actions">
                <div class="chat-shortcuts-wrap">
                    <button class="chat-composer-btn" id="chatShortcutsBtn" type="button" title="Shortcuts">
                        <i class="fa-regular fa-keyboard"></i>
                        <span class="chat-composer-btn-label">Shortcuts</span>
                    </button>
                    <div class="chat-shortcuts-menu" id="chatShortcutsMenu" role="menu">
                        <div class="chat-shortcuts-head">
                            <span>Shortcuts</span>
                            <button class="chat-shortcuts-close" id="chatShortcutsClose" type="button" title="Tutup">
                                <i class="fa-solid fa-xmark"></i>
                            </button>
                        </div>
                        <div class="chat-shortcuts-list" id="chatShortcutsList"></div>
                    </div>
                </div>

                <button class="chat-composer-btn" id="chatAttachBtn" type="button" title="Lampirkan file (segera)">
                    <i class="fa-solid fa-paperclip"></i>
                    <span class="chat-composer-btn-label">Attach</span>
                </button>

                <button class="chat-send" id="chatSend" type="button" onclick="NexusChat.send()" aria-label="Kirim">
                    <i class="fa-solid fa-arrow-up"></i>
                </button>
            </div>
        </div>
    </div>
</aside>

<div id="chatBackdrop" class="chat-backdrop" onclick="NexusChat.toggle()"></div>
