<div id="mapSection">
    <div class="section-card">
        <div class="section-header">
            <div class="section-title"><i class="fa-solid fa-globe"></i> Peta Interaktif</div>
            <div style="position:relative;">
                <select id="mapDeviceSelect" style="min-width:200px;background:var(--surface-2);border:1px solid var(--hairline);border-radius:10px;padding:9px 36px 9px 14px;color:var(--text);font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;appearance:none;">
                    <option value="">Pilih Perangkat...</option>
                </select>
                <i class="fa-solid fa-chevron-down" style="position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--text-3);pointer-events:none;font-size:11px;"></i>
            </div>
        </div>
        <div class="section-body">
            <div id="mapFull"></div>
            <div style="display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;">
                <button class="btn btn-success" id="saveLocationBtn" style="display:none;">
                    <i class="fa-solid fa-floppy-disk"></i> Simpan Lokasi
                </button>
                <span id="mapSelectedInfo" style="font-size:12px;color:var(--text-3);display:flex;align-items:center;"></span>
            </div>
        </div>
    </div>
</div>
