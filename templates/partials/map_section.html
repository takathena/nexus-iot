<div id="mapSection">
    <div class="section-card">
        <div class="section-body" style="padding: 0;">
            <div class="map-layout">
                <div class="map-layout-map">
                    <div class="map-wrapper">

                        <!-- Info bar — menyatu dengan atas map -->
                        <div class="map-hint-bar">
                            <i class="fa-solid fa-circle-info"></i>
                            <span>
                                <b>Klik device di list</b> → peta zoom ke lokasinya.
                                <b>Drag marker</b> atau <b>klik peta</b> untuk atur posisi,
                                lalu klik <b>Simpan Lokasi</b>.
                            </span>
                        </div>

                        <!-- Selected banner -->
                        <div class="map-selected-banner" id="mapSelectedBanner" style="display:none;">
                            <div class="map-selected-banner-left">
                                <span class="map-selected-dot" id="mapSelectedDot"></span>
                                <div>
                                    <div class="map-selected-name" id="mapSelectedName">—</div>
                                    <div class="map-selected-coord" id="mapSelectedCoord">Belum ada koordinat</div>
                                </div>
                            </div>
                            <div class="map-selected-banner-right">
                                <button class="btn btn-secondary" id="clearMapSelectionBtn" title="Batal">
                                    <i class="fa-solid fa-xmark"></i>
                                </button>
                                <button class="btn btn-success" id="saveLocationBtn" disabled>
                                    <i class="fa-solid fa-floppy-disk"></i> Simpan Lokasi
                                </button>
                            </div>
                        </div>

                        <!-- Map -->
                        <div id="mapFull"></div>

                        <!-- Reset View -->
                        <button class="map-reset-btn" id="resetMapViewBtn" title="Reset View" aria-label="Reset View">
                            <i class="fa-solid fa-arrows-to-circle"></i>
                        </button>

                    </div>
                </div>

                <div class="map-layout-list">
                    <div class="map-list-search">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <input type="text" id="mapSearchInput" placeholder="Cari device..."
                               autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
                    </div>

                    <div class="map-filter-chips" id="mapFilterChips">
                        <button class="map-chip active" data-filter="all">Semua</button>
                        <button class="map-chip" data-filter="online">Online</button>
                        <button class="map-chip" data-filter="offline">Offline</button>
                        <button class="map-chip" data-filter="alert">Alert</button>
                    </div>

                    <div class="map-device-list" id="mapDeviceList">
                        <div class="map-empty-list">Memuat...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
