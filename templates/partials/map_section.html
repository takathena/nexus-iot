<div id="mapSection">
    <div class="section-card">
        <div class="section-header">
            <div class="section-title"><i class="fa-solid fa-globe"></i> Peta Interaktif</div>
            <button class="btn btn-secondary" id="resetMapViewBtn">
                <i class="fa-solid fa-arrows-to-circle"></i> Reset View
            </button>
        </div>
        <div class="section-body">
            <!-- ✅ REVISI: responsive grid — desktop: map | list, mobile: map / list (stack) -->
            <div class="map-layout">
                <div class="map-layout-map">
                    <div id="mapFull"></div>
                    <div style="display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;">
                        <button class="btn btn-success" id="saveLocationBtn" style="display:none;">
                            <i class="fa-solid fa-floppy-disk"></i> Simpan Lokasi
                        </button>
                        <span id="mapSelectedInfo" style="font-size:12px;color:var(--text-3);display:flex;align-items:center;"></span>
                    </div>
                </div>

                <div class="map-layout-list">
                    <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text-3);margin-bottom:8px;">
                        Semua Device
                    </div>
                    <div class="map-device-list" id="mapDeviceList">
                        <div style="text-align:center;padding:20px;color:var(--text-3);font-size:12px;">Memuat...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
