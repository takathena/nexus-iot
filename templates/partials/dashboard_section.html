<div id="dashboardSection">
    <div class="overview-grid">
        <div class="ring-card">
            <div class="ring-wrap">
                <svg viewBox="0 0 150 150" width="150" height="150">
                    <circle class="ring-track" cx="75" cy="75" r="63"/>
                    <circle class="ring-progress" id="healthRingProgress" cx="75" cy="75" r="63"
                            stroke-dasharray="395.8" stroke-dashoffset="395.8"/>
                </svg>
                <div class="ring-center">
                    <div class="pct" id="ringPct">0%</div>
                    <div class="lbl">Sehat</div>
                </div>
            </div>
            <div class="ring-caption" id="ringCaption">0 / 0 perangkat sehat</div>
        </div>

        <div class="stats-grid-2x2">
            <div class="stat-card clickable" data-goto="devices" data-filter="all">
                <div class="stat-top"><div class="stat-icon total"><i class="fa-solid fa-server"></i></div></div>
                <div class="stat-info">
                    <h3>Total Perangkat</h3>
                    <div class="value" id="totalDevices">0</div>
                </div>
            </div>
            <div class="stat-card clickable" data-goto="alerts">
                <div class="stat-top"><div class="stat-icon alerts"><i class="fa-solid fa-bell"></i></div></div>
                <div class="stat-info">
                    <h3>Notifikasi Aktif</h3>
                    <div class="value" id="activeAlerts">0</div>
                </div>
            </div>
            <div class="stat-card clickable" data-goto="devices" data-filter="online">
                <div class="stat-top"><div class="stat-icon online"><i class="fa-solid fa-wifi"></i></div></div>
                <div class="stat-info">
                    <h3>Online</h3>
                    <div class="value" id="onlineDevices">0</div>
                </div>
            </div>
            <div class="stat-card clickable" data-goto="devices" data-filter="offline">
                <div class="stat-top"><div class="stat-icon offline"><i class="fa-solid fa-power-off"></i></div></div>
                <div class="stat-info">
                    <h3>Offline</h3>
                    <div class="value" id="offlineDevices">0</div>
                </div>
            </div>
        </div>

        <div class="activity-card">
            <div class="activity-header">
                <div class="activity-title">
                    <i class="fa-solid fa-bolt"></i> Aktivitas Terbaru
                </div>
                <button class="activity-refresh" id="activityRefreshBtn" title="Refresh">
                    <i class="fa-solid fa-rotate"></i>
                </button>
            </div>
            <div class="activity-list" id="activityList">
                <div class="activity-empty">
                    <i class="fa-solid fa-spinner fa-spin"></i> Memuat...
                </div>
            </div>
        </div>
    </div>

    <div class="section-card">
        <div class="section-header">
            <div class="section-title"><i class="fa-solid fa-list"></i> Daftar Perangkat</div>
            <button class="btn btn-primary" data-action="add-device">
                <i class="fa-solid fa-plus"></i> Tambah Perangkat
            </button>
        </div>
        <div class="filter-bar" id="deviceFilterBar">
            <button class="filter-btn active" data-filter="all">
                <i class="fa-solid fa-server"></i> Semua <span class="count" id="filterCountAll">0</span>
            </button>
            <button class="filter-btn" data-filter="online">
                <i class="fa-solid fa-wifi"></i> Online <span class="count" id="filterCountOnline">0</span>
            </button>
            <button class="filter-btn offline" data-filter="offline">
                <i class="fa-solid fa-power-off"></i> Offline <span class="count" id="filterCountOffline">0</span>
            </button>
            <button class="filter-btn warning" data-filter="alert">
                <i class="fa-solid fa-triangle-exclamation"></i> Alert <span class="count" id="filterCountAlert">0</span>
            </button>
        </div>
        <div class="section-body" style="padding:0;">
            <div class="table-wrapper">
                <table class="device-table">
                    <thead>
                        <tr>
                            <th>Status</th><th>ID</th><th>Nama</th><th>WiFi</th>
                            <th>Uptime</th><th>Terakhir</th><th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="deviceTableBody">
                        <tr><td colspan="7" style="text-align:center;padding:40px;color:var(--text-3);">Memuat...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
