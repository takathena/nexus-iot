<div id="attendanceSection">

    <div class="nx-metrics nx-metrics--3">

        <div class="nx-metric-card clickable" data-stat-type="hadir">
            <div class="nx-metric-head">
                <span class="nx-metric-title">Hadir Hari Ini</span>
                <div class="nx-metric-menu">
                    <button class="nx-metric-menu-btn" type="button" aria-label="Menu">
                        <i class="fa-solid fa-ellipsis-vertical"></i>
                    </button>
                    <div class="nx-metric-menu__list">
                        <button class="nx-metric-menu__item" data-action="view" data-key="statHadirHariIni">
                            <i class="fa-regular fa-eye"></i> Lihat detail
                        </button>
                        <button class="nx-metric-menu__item" data-action="copy" data-key="statHadirHariIni">
                            <i class="fa-regular fa-copy"></i> Salin nilai
                        </button>
                    </div>
                </div>
            </div>
            <div class="nx-metric-body">
                <div class="nx-metric-value ok" id="statHadirHariIni" data-value="statHadirHariIni">0</div>
                <div class="nx-metric-spark" data-spark="statHadirHariIni"></div>
            </div>
            <div class="nx-metric-foot">
                <span class="nx-metric-trend neutral" data-trend="statHadirHariIni">
                    <i class="fa-solid fa-minus"></i> 0%
                </span>
                <span class="nx-metric-trend-label" data-trend-label="statHadirHariIni">vs minggu lalu</span>
            </div>
        </div>

        <div class="nx-metric-card clickable" data-stat-type="total">
            <div class="nx-metric-head">
                <span class="nx-metric-title">Total Kartu Aktif</span>
                <div class="nx-metric-menu">
                    <button class="nx-metric-menu-btn" type="button" aria-label="Menu">
                        <i class="fa-solid fa-ellipsis-vertical"></i>
                    </button>
                    <div class="nx-metric-menu__list">
                        <button class="nx-metric-menu__item" data-action="view" data-key="statTotalKartu">
                            <i class="fa-regular fa-eye"></i> Lihat detail
                        </button>
                        <button class="nx-metric-menu__item" data-action="copy" data-key="statTotalKartu">
                            <i class="fa-regular fa-copy"></i> Salin nilai
                        </button>
                    </div>
                </div>
            </div>
            <div class="nx-metric-body">
                <div class="nx-metric-value info" id="statTotalKartu" data-value="statTotalKartu">0</div>
                <div class="nx-metric-spark" data-spark="statTotalKartu"></div>
            </div>
            <div class="nx-metric-foot">
                <span class="nx-metric-trend neutral" data-trend="statTotalKartu">
                    <i class="fa-solid fa-minus"></i> 0%
                </span>
                <span class="nx-metric-trend-label" data-trend-label="statTotalKartu">vs minggu lalu</span>
            </div>
        </div>

        <div class="nx-metric-card clickable" data-stat-type="belum-terdaftar">
            <div class="nx-metric-head">
                <span class="nx-metric-title">Kartu Belum Terdaftar</span>
                <div class="nx-metric-menu">
                    <button class="nx-metric-menu-btn" type="button" aria-label="Menu">
                        <i class="fa-solid fa-ellipsis-vertical"></i>
                    </button>
                    <div class="nx-metric-menu__list">
                        <button class="nx-metric-menu__item" data-action="view" data-key="statBelumTerdaftar">
                            <i class="fa-regular fa-eye"></i> Lihat detail
                        </button>
                        <button class="nx-metric-menu__item" data-action="copy" data-key="statBelumTerdaftar">
                            <i class="fa-regular fa-copy"></i> Salin nilai
                        </button>
                    </div>
                </div>
            </div>
            <div class="nx-metric-body">
                <div class="nx-metric-value warn" id="statBelumTerdaftar" data-value="statBelumTerdaftar">0</div>
                <div class="nx-metric-spark" data-spark="statBelumTerdaftar"></div>
            </div>
            <div class="nx-metric-foot">
                <span class="nx-metric-trend neutral" data-trend="statBelumTerdaftar">
                    <i class="fa-solid fa-minus"></i> 0%
                </span>
                <span class="nx-metric-trend-label" data-trend-label="statBelumTerdaftar">vs minggu lalu</span>
            </div>
        </div>

    </div>

    <div class="attendance-toolbar">
        <div class="attendance-tabs">
            <button class="attendance-tab active" data-tab="report">
                <i class="fa-solid fa-clipboard-list"></i>
                <span>Laporan Harian</span>
            </button>
            <button class="attendance-tab" data-tab="history">
                <i class="fa-solid fa-clock-rotate-left"></i>
                <span>Riwayat Tap</span>
            </button>
        </div>
        <div class="attendance-actions">
            <button class="btn btn-secondary" id="attendanceExportBtn">
                <i class="fa-solid fa-download"></i>
                <span>Export CSV</span>
            </button>
            <button class="btn btn-primary" data-action="open-cardholder-modal" data-needs="perm:attendance.manage">
                <i class="fa-solid fa-plus"></i>
                <span>Daftarkan Kartu</span>
            </button>
        </div>
    </div>

    <div class="attendance-filter-bar" id="attendanceFilterBar">
        <div class="attendance-filter-group">
            <label for="attendanceStartDate">Dari</label>
            <input type="date" id="attendanceStartDate">
        </div>
        <div class="attendance-filter-group">
            <label for="attendanceEndDate">Sampai</label>
            <input type="date" id="attendanceEndDate">
        </div>
        <div class="attendance-filter-actions">
            <button class="btn btn-secondary" id="attendanceApplyFilter">
                <i class="fa-solid fa-filter"></i>
                <span>Terapkan</span>
            </button>
            <button class="btn btn-secondary" id="attendanceClearFilter">
                <i class="fa-solid fa-xmark"></i>
                <span>Reset</span>
            </button>
        </div>
        <span class="attendance-filter-info" id="attendanceFilterInfo"></span>
    </div>

    <div class="section-card">
        <div class="section-body" style="padding:0;">
            <div class="table-wrapper">
                <table class="device-table">
                    <thead id="attendanceThead">
                        <tr>
                            <th>Tanggal</th>
                            <th>Nama</th>
                            <th>UID</th>
                            <th>Check-in</th>
                            <th>Check-out</th>
                        </tr>
                    </thead>
                    <tbody id="attendanceTableBody">
                        <tr>
                            <td colspan="5" style="text-align:center;padding:40px;color:var(--text-3);">
                                Memuat...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</div>
