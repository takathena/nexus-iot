<!-- ADD DEVICE MODAL -->
<div class="modal" id="addDeviceModal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Tambah Perangkat</h3>
            <button class="modal-close">&times;</button>
        </div>
        <div class="form-group">
            <label>Device ID</label>
            <input type="text" id="addDeviceId" placeholder="ESP32-001">
        </div>
        <div class="form-group">
            <label>Nama</label>
            <input type="text" id="addDeviceName" placeholder="Sensor Suhu">
        </div>
        <div class="form-group">
            <label>Tipe</label>
            <select id="addDeviceType">
                <option>ESP32</option>
                <option>ESP8266</option>
                <option>Arduino</option>
                <option>Raspberry Pi</option>
                <option>Other</option>
            </select>
        </div>
        <div class="form-group">
            <label>Lokasi</label>
            <input type="text" id="addDeviceLocation" placeholder="Ruang Server">
        </div>
        <div class="modal-actions">
            <button class="btn btn-secondary modal-close">Batal</button>
            <button class="btn btn-success" data-action="submit-add-device">Simpan</button>
        </div>
    </div>
</div>

<!-- CHART MODAL -->
<div class="modal" id="chartModal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="chartModalTitle">Tambah Diagram</h3>
            <button class="modal-close">&times;</button>
        </div>
        <input type="hidden" id="editChartId" value="">
        <div class="form-group">
            <label>Judul Diagram</label>
            <input type="text" id="chartTitle" placeholder="Contoh: Suhu Ruang Server">
        </div>
        <div class="form-group">
            <label>Pilih Perangkat</label>
            <select id="chartDeviceSelect">
                <option value="">Pilih Perangkat…</option>
            </select>
        </div>
        <div class="form-group">
            <label>Tipe Diagram</label>
            <select id="chartTypeSelect">
                <optgroup label="Dasar">
                    <option value="line">Line Chart</option>
                    <option value="bar">Bar Chart</option>
                    <option value="area">Area Chart</option>
                    <option value="scatter">Scatter Plot</option>
                </optgroup>
                <optgroup label="Statistik">
                    <option value="doughnut">Doughnut Chart</option>
                    <option value="pie">Pie Chart</option>
                    <option value="polarArea">Polar Area</option>
                    <option value="radar">Radar Chart</option>
                </optgroup>
                <optgroup label="Khusus">
                    <option value="horizontalBar">Horizontal Bar</option>
                    <option value="stackedBar">Stacked Bar</option>
                    <option value="stackedArea">Stacked Area</option>
                </optgroup>
            </select>
        </div>
        <div class="form-group">
            <label>Data yang Ditampilkan</label>
            <div class="checkbox-grid" id="chartDataCheckboxes"></div>
        </div>
        <div class="modal-actions">
            <button class="btn btn-secondary modal-close">Batal</button>
            <button class="btn btn-success" data-action="save-chart">
                <i class="fa-solid fa-check"></i> Simpan
            </button>
        </div>
    </div>
</div>

<!-- API KEY MODAL -->
<div class="modal" id="apiKeyModal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>API Key</h3>
            <button class="modal-close">&times;</button>
        </div>
        <p style="font-size:12.5px;color:var(--text-2);margin-bottom:10px;">
            Simpan API Key ini — hanya muncul sekali:
        </p>
        <div style="background:var(--surface-2);border:1px solid var(--hairline);border-radius:11px;padding:13px;display:flex;align-items:center;gap:10px;">
            <code id="apiKeyDisplay" style="flex:1;font-size:11.5px;color:var(--teal);word-break:break-all;font-family:var(--mono);"></code>
            <button class="btn btn-primary" data-action="copy-api-key">Copy</button>
        </div>
        <button class="btn btn-primary modal-close" style="width:100%;margin-top:16px;">
            Saya Sudah Simpan
        </button>
    </div>
</div>

<!-- DELETE MODAL -->
<div class="modal" id="deleteModal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Hapus Perangkat</h3>
            <button class="modal-close">&times;</button>
        </div>
        <p style="margin-bottom:16px;color:var(--text-2);font-size:13.5px;">
            Tindakan ini tidak dapat dibatalkan. Yakin ingin menghapus perangkat ini?
        </p>
        <input type="hidden" id="deleteDeviceId">
        <div class="modal-actions">
            <button class="btn btn-secondary modal-close">Batal</button>
            <button class="btn btn-danger" data-action="confirm-delete">Hapus</button>
        </div>
    </div>
</div>
