<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="csrf-token" content="{{ csrf_token() }}">
<title>Detail Perangkat — NEXUS</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root {
  --bg: #09090b;
  --surface: #131316;
  --surface-2: #1c1c1f;
  --hairline: #27272a;
  --hairline-soft: #1c1c1f;
  --text: #fafafa;
  --text-2: #a1a1aa;
  --text-3: #52525b;
  --primary: #fafafa;
  --primary-fg: #09090b;
  --accent-ok: #22c55e;
  --accent-warn: #f97316;
  --accent-crit: #ef4444;
  --accent-info: #3b82f6;
  --accent-ok-bg: rgba(34, 197, 94, 0.12);
  --accent-warn-bg: rgba(249, 115, 22, 0.12);
  --accent-crit-bg: rgba(239, 68, 68, 0.12);
  --accent-info-bg: rgba(59, 130, 246, 0.12);
  --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  --mono: 'JetBrains Mono', monospace;
  --ease: cubic-bezier(0.4, 0, 0.2, 1);
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 20px;
}
[data-theme="light"] {
  --bg: #fafafa;
  --surface: #ffffff;
  --surface-2: #f4f4f5;
  --hairline: #e4e4e7;
  --hairline-soft: #f0f0f2;
  --text: #09090b;
  --text-2: #52525b;
  --text-3: #a1a1aa;
  --primary: #09090b;
  --primary-fg: #ffffff;
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  transition: background 0.2s ease, color 0.2s ease;
}
.hero {
  padding: 28px 26px 56px;
  border-bottom: 1px solid var(--hairline-soft);
}
.hero-content {
  max-width: 1080px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  flex-wrap: wrap;
}
.hero-left { display: flex; align-items: center; gap: 15px; }
.device-avatar {
  width: 52px;
  height: 52px;
  border-radius: 15px;
  background: var(--surface-2);
  border: 1px solid var(--hairline);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  color: var(--text);
  flex-shrink: 0;
}
.hero-title h1 { font-size: 22px; font-weight: 800; margin-bottom: 6px; color: var(--text); }
.hero-meta { display: flex; gap: 15px; font-size: 12px; color: var(--text-3); font-weight: 600; flex-wrap: wrap; }
.hero-meta span { display: flex; align-items: center; gap: 6px; }
.hero-actions { display: flex; gap: 10px; flex-wrap: wrap; }
.back-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 10px 18px;
  background: var(--surface);
  border: 1px solid var(--hairline);
  border-radius: 12px;
  color: var(--text-2);
  text-decoration: none;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s var(--ease);
  font-family: inherit;
}
.back-btn:hover { background: var(--surface-2); color: var(--text); border-color: var(--text-3); }
.back-btn.primary { background: var(--primary); color: var(--primary-fg); border-color: var(--primary); }
.back-btn.primary:hover { background: var(--text-2); }
.back-btn.danger { color: var(--accent-crit); border-color: rgba(239, 68, 68, 0.3); }
.back-btn.danger:hover { background: var(--accent-crit-bg); }
.container {
  max-width: 1080px;
  margin: -30px auto 40px;
  padding: 0 22px;
  position: relative;
  z-index: 3;
  display: grid;
  gap: 18px;
}
.card {
  background: var(--surface);
  border: 1px solid var(--hairline);
  border-radius: var(--radius-xl);
  padding: 24px;
  animation: rise 0.3s var(--ease) backwards;
}
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
.card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 18px;
  flex-wrap: wrap;
  gap: 10px;
}
.card-title {
  font-size: 14.5px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 9px;
  color: var(--text);
}
.card-title i { color: var(--text-2); }
.live-indicator {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 12px;
  background: var(--accent-ok-bg);
  border: 1px solid rgba(34, 197, 94, 0.25);
  border-radius: 20px;
  font-size: 10px;
  font-weight: 800;
  color: var(--accent-ok);
  text-transform: uppercase;
}
.live-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--accent-ok);
  animation: pulse 2s infinite;
}
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
.info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 16px; }
.info-item label {
  display: block;
  font-size: 10px;
  font-weight: 700;
  color: var(--text-3);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-bottom: 6px;
}
.info-item .value { font-size: 14px; font-weight: 600; color: var(--text); }
.info-item .value.mono { font-family: var(--mono); font-size: 12.5px; }
.status-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 11px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 700;
  text-transform: capitalize;
}
.status-badge.online { background: var(--accent-ok-bg); color: var(--accent-ok); }
.status-badge.offline { background: var(--accent-crit-bg); color: var(--accent-crit); }
.status-badge.danger { background: var(--accent-crit-bg); color: var(--accent-crit); border: 1px solid rgba(239, 68, 68, 0.3); }
.status-badge.warning { background: var(--accent-warn-bg); color: var(--accent-warn); border: 1px solid rgba(249, 115, 22, 0.3); }
.status-badge.info { background: var(--accent-info-bg); color: var(--accent-info); border: 1px solid rgba(59, 130, 246, 0.3); }
.status-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.status-badge.online .status-dot { animation: pulse 2s infinite; }
.sensor-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; }
.sensor-card {
  background: var(--surface-2);
  border: 1px solid var(--hairline);
  border-radius: var(--radius-lg);
  padding: 18px;
}
.sensor-icon {
  width: 36px;
  height: 36px;
  border-radius: 11px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  margin-bottom: 12px;
}
.sensor-name {
  font-size: 11px;
  color: var(--text-3);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  font-weight: 700;
  margin-bottom: 5px;
}
.sensor-value { font-size: 26px; font-weight: 800; font-family: var(--mono); line-height: 1.1; color: var(--text); }
.sensor-unit { font-size: 11px; color: var(--text-3); font-weight: 600; margin-top: 2px; margin-bottom: 12px; }
.sensor-gauge { height: 4px; border-radius: 3px; background: var(--hairline); overflow: hidden; }
.sensor-gauge-fill { height: 100%; border-radius: 3px; transition: width 0.6s var(--ease); }
.loading-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 50px 20px;
  gap: 14px;
}
.spinner {
  width: 26px;
  height: 26px;
  border: 2.5px solid var(--hairline);
  border-top-color: var(--text);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { font-size: 12.5px; color: var(--text-3); font-weight: 600; }
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 50px 20px;
  text-align: center;
  gap: 8px;
}
.empty-state i { font-size: 30px; color: var(--text-3); margin-bottom: 6px; }
.empty-state h3 { font-size: 15px; font-weight: 700; color: var(--text); }
.empty-state p { font-size: 12.5px; color: var(--text-3); }
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-thumb { background: var(--hairline); border-radius: 3px; }
@media (max-width: 600px) {
  .hero { padding: 22px 18px 50px; }
  .container { margin: -26px auto 30px; padding: 0 14px; }
  .card { padding: 18px; border-radius: 18px; }
  .hero-actions { width: 100%; }
  .back-btn { flex: 1; justify-content: center; }
}
</style>
</head>
<body>
  <div class="hero">
    <div class="hero-content">
      <div class="hero-left">
        <div class="device-avatar"><i class="fa-solid fa-satellite-dish"></i></div>
        <div>
          <h1 id="deviceName">Memuat...</h1>
          <div class="hero-meta">
            <span><i class="fa-solid fa-fingerprint"></i> <span id="deviceIdDisplay">{{ device_id }}</span></span>
            <span><i class="fa-regular fa-clock"></i> <span id="lastUpdate">--:--:--</span></span>
          </div>
        </div>
      </div>
      <div class="hero-actions">
        <button class="back-btn" id="btnRegenerateKey" title="Regenerate API Key">
          <i class="fa-solid fa-key"></i> Regenerate
        </button>
        <button class="back-btn" id="btnExport" title="Export Data">
          <i class="fa-solid fa-download"></i> Export
        </button>
        <button class="back-btn" id="btnBack" title="Kembali">
          <i class="fa-solid fa-arrow-left"></i> <span id="backLabel">Kembali</span>
        </button>
      </div>
    </div>
  </div>

  <div class="container">
    <div class="card">
      <div class="card-header">
        <div class="card-title"><i class="fa-solid fa-bell"></i> Alert Aktif</div>
      </div>
      <div id="activeAlertsContent">
        <div class="loading-state"><div class="spinner"></div><div class="loading-text">Memuat...</div></div>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <div class="card-title"><i class="fa-solid fa-circle-info"></i> Informasi Perangkat</div>
        <span class="live-indicator" id="liveIndicator" style="display:none;"><span class="live-dot"></span> Live</span>
      </div>
      <div id="infoContent"><div class="loading-state"><div class="spinner"></div><div class="loading-text">Memuat...</div></div></div>
    </div>

    <div class="card">
      <div class="card-header">
        <div class="card-title"><i class="fa-solid fa-wave-square"></i> Data Sensor Terbaru</div>
        <span style="font-size:11px;color:var(--text-3);font-weight:600;" id="sensorMeta"></span>
      </div>
      <div id="sensorContent"><div class="loading-state"><div class="spinner"></div><div class="loading-text">Memuat...</div></div></div>
    </div>
  </div>

  <script>
    const deviceId = '{{ device_id }}';
    const CSRF_TOKEN = (document.querySelector('meta[name="csrf-token"]') || {}).content || '';

    // Token warna sensor (konsisten dengan dashboard.js)
    const SENSOR_META = {
      temperature: { icon: 'fa-temperature-half', color: '#ef4444', unit: '°C', range: [0, 50] },
      humidity: { icon: 'fa-droplet', color: '#3b82f6', unit: '%', range: [0, 100] },
      moisture: { icon: 'fa-water', color: '#0ea5e9', unit: '%', range: [0, 100] },
      lux: { icon: 'fa-sun', color: '#eab308', unit: 'lux', range: [0, 1000] },
      co2: { icon: 'fa-cloud', color: '#22c55e', unit: 'ppm', range: [0, 2000] },
      voc: { icon: 'fa-wind', color: '#a855f7', unit: 'ppb', range: [0, 500] },
      gas_level: { icon: 'fa-fire', color: '#f97316', unit: 'ppm', range: [0, 100] },
      air_quality: { icon: 'fa-lungs', color: '#3b82f6', unit: 'AQI', range: [0, 500] },
      smoke: { icon: 'fa-smog', color: '#a855f7', unit: 'ppm', range: [0, 1000] },
      motion: { icon: 'fa-person-running', color: '#06b6d4', unit: '', range: [0, 1] },
    };

    function getSensorMeta(key) {
      return SENSOR_META[key] || { icon: 'fa-microchip', color: '#a1a1aa', unit: '', range: [0, 100] };
    }

    function getGaugePercent(key, value) {
      const meta = getSensorMeta(key);
      const [min, max] = meta.range;
      return Math.min(100, Math.max(0, ((value - min) / (max - min)) * 100));
    }

    function formatUptime(seconds) {
      if (!seconds && seconds !== 0) return '-';
      seconds = parseInt(seconds) || 0;
      if (seconds < 60) return `${seconds}s`;
      const d = Math.floor(seconds / 86400);
      const h = Math.floor((seconds % 86400) / 3600);
      const m = Math.floor((seconds % 3600) / 60);
      if (d > 0) return `${d}h ${h}j ${m}m`;
      if (h > 0) return `${h}j ${m}m`;
      return `${m}m`;
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = String(str ?? '');
      return div.innerHTML;
    }

    // Theme
    (function() {
      const savedTheme = localStorage.getItem('nexus-theme') || 'dark';
      document.documentElement.setAttribute('data-theme', savedTheme);
    })();

    // Back navigation
    function setupBackNavigation() {
      const btnBack = document.getElementById('btnBack');
      const backLabel = document.getElementById('backLabel');
      if (!btnBack) return;

      const storedBackUrl = sessionStorage.getItem('nexus_back_url');
      const referrer = document.referrer;
      const currentOrigin = window.location.origin;

      let backUrl = '/#dashboard';
      let backLabelText = 'Kembali';

      if (storedBackUrl && storedBackUrl.startsWith('/')) {
        backUrl = storedBackUrl;
      } else if (referrer && referrer.startsWith(currentOrigin)) {
        backUrl = referrer.replace(currentOrigin, '');
      }

      if (backUrl.includes('/alerts') || backUrl.includes('#alerts')) backLabelText = 'Ke Alert';
      else if (backUrl.includes('#devices')) backLabelText = 'Ke Perangkat';
      else if (backUrl.includes('#attendance')) backLabelText = 'Ke Absensi';
      else if (backUrl.includes('#map')) backLabelText = 'Ke Peta';
      else if (backUrl.includes('#graph')) backLabelText = 'Ke Analitik';
      else if (backUrl === '/#dashboard' || backUrl === '/') backLabelText = 'Ke Dashboard';

      backLabel.textContent = backLabelText;
      btnBack.addEventListener('click', () => {
        sessionStorage.removeItem('nexus_back_url');
        window.location.href = backUrl;
      });
    }
    setupBackNavigation();

    // Regenerate key
    document.getElementById('btnRegenerateKey').addEventListener('click', async () => {
      if (!confirm(`Regenerate API key untuk "${deviceId}"?\n\nKey lama tidak akan berfungsi lagi.`)) return;
      try {
        const res = await fetch(`/api/v1/devices/${encodeURIComponent(deviceId)}/regenerate-key`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-CSRFToken': CSRF_TOKEN },
        });
        const data = await res.json();
        if (data.success) {
          showNewKeyModal(data.api_key);
        } else {
          alert('Gagal: ' + (data.error || 'Unknown error'));
        }
      } catch (e) {
        alert('Error: ' + e.message);
      }
    });

    function showNewKeyModal(newKey) {
      const modal = document.createElement('div');
      modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;';
      modal.innerHTML = `
        <div style="background:var(--surface);border:1px solid var(--hairline);border-radius:20px;padding:26px;max-width:480px;width:100%;box-shadow:0 30px 70px rgba(0,0,0,.5);">
          <h3 style="margin-bottom:12px;font-size:18px;font-weight:800;">API Key Baru</h3>
          <p style="font-size:13px;color:var(--text-2);margin-bottom:14px;">Simpan key ini - hanya muncul sekali:</p>
          <div style="background:var(--surface-2);border:1px solid var(--hairline);border-radius:11px;padding:13px;font-family:var(--mono);font-size:11.5px;color:var(--text);word-break:break-all;margin-bottom:16px;">${escapeHtml(newKey)}</div>
          <div style="display:flex;gap:8px;">
            <button id="copyNewKey" class="back-btn primary" style="flex:1;justify-content:center;">Copy</button>
            <button id="closeNewKey" class="back-btn" style="flex:1;justify-content:center;">Tutup</button>
          </div>
        </div>
      `;
      document.body.appendChild(modal);

      modal.querySelector('#copyNewKey').addEventListener('click', () => {
        navigator.clipboard.writeText(newKey).then(() => {
          modal.querySelector('#copyNewKey').textContent = 'Tersalin!';
          setTimeout(() => modal.querySelector('#copyNewKey').textContent = 'Copy', 1500);
        });
      });
      modal.querySelector('#closeNewKey').addEventListener('click', () => modal.remove());
    }

    // Export
    document.getElementById('btnExport').addEventListener('click', () => {
      window.location.href = `/api/v1/devices/${encodeURIComponent(deviceId)}/export?format=csv&hours=24`;
    });

    // Active alerts
    function renderActiveAlerts(alerts) {
      const container = document.getElementById('activeAlertsContent');
      if (!container) return;

      if (!alerts || alerts.length === 0) {
        container.innerHTML = `
          <div class="empty-state" style="padding:30px;">
            <i class="fa-solid fa-circle-check" style="color:var(--accent-ok);"></i>
            <h3 style="color:var(--accent-ok);">Semua Normal</h3>
            <p>Tidak ada alert aktif untuk perangkat ini</p>
          </div>
        `;
        return;
      }

      const severityIcon = { danger: 'fa-fire', warning: 'fa-triangle-exclamation', info: 'fa-circle-info' };
      const severityColorVar = { danger: '--accent-crit', warning: '--accent-warn', info: '--accent-info' };

      let html = '<div style="display:flex;flex-direction:column;gap:10px;">';
      alerts.forEach(a => {
        const varName = severityColorVar[a.severity] || '--accent-info';
        const icon = severityIcon[a.severity] || 'fa-bell';
        html += `
          <div style="background:var(${varName}-bg);border:1px solid var(${varName});border-left:3px solid var(${varName});border-radius:11px;padding:12px 14px;">
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;">
              <i class="fa-solid ${icon}" style="color:var(${varName});font-size:12px;"></i>
              <span style="font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(${varName});">${escapeHtml(a.severity)}</span>
              <span style="font-size:10px;color:var(--text-3);font-family:var(--mono);">${escapeHtml(a.alert_type)}</span>
            </div>
            <div style="font-size:12.5px;color:var(--text-2);font-weight:500;">${escapeHtml(a.message)}</div>
            <div style="font-size:10px;color:var(--text-3);margin-top:4px;font-family:var(--mono);">${escapeHtml(String(a.created_at))}</div>
          </div>
        `;
      });
      html += '</div>';
      container.innerHTML = html;
    }

    // Load device detail
    async function loadDeviceDetail() {
      try {
        const response = await fetch(`/api/v1/devices/${encodeURIComponent(deviceId)}`);
        const data = await response.json();
        if (!data.success) return;

        const device = data.device;
        document.getElementById('deviceName').textContent = device.device_name;
        document.getElementById('deviceIdDisplay').textContent = device.device_id;
        document.getElementById('lastUpdate').textContent = device.last_seen
          ? new Date(String(device.last_seen).replace(' ', 'T') + '+07:00').toLocaleTimeString('id-ID', { timeZone: 'Asia/Jakarta' }) + ' WIB'
          : 'Belum pernah aktif';

        const liveInd = document.getElementById('liveIndicator');
        liveInd.style.display = device.status === 'online' ? 'inline-flex' : 'none';

        let statusClass = device.status;
        let statusLabel = device.status;
        if (device.active_alerts && device.active_alerts.length > 0) {
          const topSev = device.active_alerts[0].severity;
          if (topSev === 'danger') { statusClass = 'danger'; statusLabel = 'BAHAYA'; }
          else if (topSev === 'warning') { statusClass = 'warning'; statusLabel = 'PERINGATAN'; }
        }

        const statusHtml = `<span class="status-badge ${statusClass}"><span class="status-dot"></span>${escapeHtml(statusLabel)}</span>`;
        const wifiSsid = device.latest_data ? (device.latest_data.wifi_ssid || '-') : '-';
        const uptimeDisplay = formatUptime(device.latest_data ? (device.latest_data.uptime_seconds || 0) : 0);

        document.getElementById('infoContent').innerHTML = `
          <div class="info-grid">
            <div class="info-item"><label>ID Perangkat</label><span class="value mono">${escapeHtml(device.device_id)}</span></div>
            <div class="info-item"><label>Tipe</label><span class="value">${escapeHtml(device.device_type || 'Universal')}</span></div>
            <div class="info-item"><label>Lokasi</label><span class="value">${escapeHtml(device.location || 'Belum diatur')}</span></div>
            <div class="info-item"><label>Status</label>${statusHtml}</div>
            <div class="info-item"><label>WiFi SSID</label><span class="value">${escapeHtml(wifiSsid)}</span></div>
            <div class="info-item"><label>Uptime</label><span class="value">${uptimeDisplay}</span></div>
            <div class="info-item"><label>Interval Kirim</label><span class="value">${formatUptime(device.expected_interval || 60)}</span></div>
            <div class="info-item"><label>Offline Timeout</label><span class="value">${formatUptime(device.offline_timeout || 900)}</span></div>
            <div class="info-item"><label>Terakhir Aktif</label><span class="value">${escapeHtml(String(device.last_seen || 'Belum pernah'))}</span></div>
          </div>
        `;

        renderActiveAlerts(device.active_alerts);

        if (device.latest_data && device.latest_data.data) {
          const sensorData = device.latest_data.data;
          let sensorHtml = '<div class="sensor-grid">';
          for (const [key, value] of Object.entries(sensorData)) {
            if (key === 'uid') continue;
            const meta = getSensorMeta(key);
            const displayName = key.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
            const gaugePercent = getGaugePercent(key, value);
            sensorHtml += `
              <div class="sensor-card">
                <div class="sensor-icon" style="background:${meta.color}1f;color:${meta.color};">
                  <i class="fa-solid ${meta.icon}"></i>
                </div>
                <div class="sensor-name">${escapeHtml(displayName)}</div>
                <div class="sensor-value" style="color:${meta.color};">${escapeHtml(String(value))}</div>
                <div class="sensor-unit">${escapeHtml(meta.unit)}</div>
                <div class="sensor-gauge">
                  <div class="sensor-gauge-fill" style="width:${gaugePercent}%;background:${meta.color};"></div>
                </div>
              </div>`;
          }
          sensorHtml += '</div>';
          document.getElementById('sensorContent').innerHTML = sensorHtml;
          document.getElementById('sensorMeta').textContent = `${device.latest_data.sensor_type || 'Unknown'} • ${device.latest_data.timestamp}`;
        } else {
          document.getElementById('sensorContent').innerHTML = `<div class="empty-state"><i class="fa-solid fa-satellite-dish"></i><h3>Belum Ada Data</h3><p>Perangkat belum mengirimkan data sensor</p></div>`;
        }
      } catch (error) {
        document.getElementById('infoContent').innerHTML = `<div class="empty-state"><i class="fa-solid fa-triangle-exclamation"></i><h3>Koneksi Gagal</h3><p>Tidak dapat memuat data perangkat.</p></div>`;
      }
    }

    loadDeviceDetail();
    setInterval(loadDeviceDetail, 10000);
  </script>
</body>
</html>
